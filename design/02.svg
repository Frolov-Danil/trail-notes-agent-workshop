<text x="24" y="737.3" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#183C32">Перед выходом посмотрите прогноз, время</text>
<text x="24" y="762.3" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#183C32">заката и варианты возвращения. Сообщите</text>
<text x="24" y="787.3" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#183C32">близкому человеку, куда идёте и когда…</text>
